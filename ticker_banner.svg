      .label { fill: #c9d1d9; }
      .title { font-family: 'Consolas', monospace; font-size: 13px; fill: #6e7681; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="900" height="90" fill="url(#bg)" rx="10"/>
